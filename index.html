                        document.write(text);
                        document.close();
                        return;
                    }
                    
                    const arrayBuffer = await blob.arrayBuffer();
                    const ui8 = new Uint8Array(arrayBuffer);
                    const unzipped = pako.ungzip(ui8);
                    const text = new TextDecoder().decode(unzipped);
                    
                    document.open();
                    document.write(text);
                    document.close();
                    
                } catch(e) {
                    document.querySelector('.loader').style.display = 'none';
                    document.getElementById('status').innerHTML = "❌ Browser decompression error: " + e.message;
                }
            }
            
            window.addEventListener('load', bootstrapDashboard);
        </script>
    </body>
    </html>
